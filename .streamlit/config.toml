# Theme for the Silicon Town Hall app: light only, EB Garamond throughout. One theme means Streamlit shows no
# theme switch and ignores the system dark setting. Chart colors are the dataviz reference palette, validated for
# color vision deficiency on a light surface; the order of chartCategoricalColors is part of that check, so keep it.

[theme]
base = "light"
font = "EB Garamond:https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap, Garamond, serif"
headingFont = "EB Garamond:https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap, Garamond, serif"
headingFontWeights = [500, 500, 600, 600, 600, 600]
baseFontSize = 17
baseRadius = "0.3rem"
buttonRadius = "0.3rem"
showWidgetBorder = true
showSidebarBorder = true
primaryColor = "#1c5cab"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f7"
textColor = "#1c2430"
borderColor = "#d5dbe2"
linkColor = "#1c5cab"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#1c5cab", "#0d366b"]

[theme.sidebar]
backgroundColor = "#f3f5f7"
secondaryBackgroundColor = "#ffffff"
